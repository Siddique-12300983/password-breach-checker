[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "password-breach-checker"
version = "1.0.0"
description = "Check a password against Have I Been Pwned using k-anonymity, without sending the password."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Md Abu Bakar Siddique" }]
dependencies = ["requests>=2.28"]

[project.scripts]
password-breach-checker = "breachchecker.cli:main"

[tool.setuptools.packages.find]
include = ["breachchecker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
